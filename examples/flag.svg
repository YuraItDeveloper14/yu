<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
<style>
.yu>*{animation:yu-in .3s ease-out backwards}
.yu>line{animation:yu-draw 0.15s linear backwards}
@keyframes yu-in{from{opacity:0}}
@keyframes yu-draw{from{stroke-dasharray:1;stroke-dashoffset:1}to{stroke-dasharray:1;stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.yu>*{animation:none}}
</style>
<rect width="600" height="400" fill="#ffffff"/>
<g class="yu" stroke-linecap="round" stroke-linejoin="round" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20">
<rect x="0" y="0" width="600" height="200" fill="#0057b7" style="animation-delay:0s"/>
<rect x="0" y="200" width="600" height="200" fill="#ffd700" style="animation-delay:0.15s"/>
<text x="24" y="40" fill="#ffffff" style="animation-delay:0.3s">Україна</text>
</g>
</svg>
